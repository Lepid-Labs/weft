name: Release

# Publishes every public workspace package whose version is not yet on npm.
# Trigger: push a tag `v<version>` after `just release <version>`.
# Auth is npm trusted publishing (OIDC): each package on npmjs.com trusts this
# workflow, so there is no token secret. A new package must be published once
# by hand (`just publish`) before it can be given a trusted publisher.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches the package version
        run: |
          expected="v$(node -p "require('./packages/cli/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $expected" >&2
            exit 1
          fi

      # Build every package up front rather than relying on prepublishOnly
      # alone. pnpm skips a version already on npm *and its prepublishOnly*, so
      # on a re-run weft-core went unbuilt and the embed — whose build resolves
      # @lepid-labs/weft-core through its dist/ — failed. With this, re-running
      # a release that stopped partway is safe.
      - name: Build
        run: pnpm -r run build

      # Each package's prepublishOnly builds it again; pnpm skips versions
      # already published.
      - name: Publish
        run: pnpm -r publish --access public --no-git-checks --provenance
